[workspace]
resolver = "3"
members = ["crates/dsp", "crates/cli"]

[workspace.package]
edition = "2024"
version = "0.1.0"
repository = "https://github.com/abishz17/mic-enhance"

[workspace.dependencies]
hound = "3.5"
rubato = "5"
ebur128 = "0.1.10"
nnnoiseless = { version = "0.5", default-features = false }
realfft = "3.5"
serde = { version = "1", features = ["derive"] }
toml = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
serde_json = "1"
tempfile = "3"

# DSP code is unusably slow at opt-level 0; keep debug info but optimise.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
