[project]
name = "mic-eval"
version = "0.1.0"
description = "Measurement harness for mic-enhance: loudness, noise, bandwidth, MOS, invented-word guard, ABX"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper>=1.2.1",
    "librosa>=1.0.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "onnxruntime>=1.31.0",
    "pesq>=0.0.4",
    "pyloudnorm>=0.2.0",
    "pystoi>=0.4.1",
    "rapidfuzz>=3.14.6",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "speechbrain>=1.1.1",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
]

[project.scripts]
mic-eval = "mic_eval:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
