[project]
name = "mlstage"
version = "0.1.0"
description = "ML enhancement stage for mic-enhance (clean + studio models)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "deepfilternet>=0.5.6",
    "dpdfnet==0.6.0",
    "einops>=0.8.2",
    "huggingface-hub>=2.2.0",
    "librosa>=0.11.0",
    "numpy",
    "onnxruntime>=1.31.0",
    "pyrnnoise>=0.4.5",
    "pyyaml>=6.0.3",
    "soundfile",
    "soxr",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "transformers>=4.45",
]

[project.scripts]
mlstage = "mlstage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlstage"]

[dependency-groups]
bakeoff = [
    "faster-whisper>=1.2.1",
    "jiwer>=4.0.0",
    "pandas>=3.0.6",
    "pesq>=0.0.4",
    "pyworld>=0.3.5",
    "setuptools<81",
    "speechbrain>=1.1.1",
    "speechmos>=0.0.1.1",
    "tabulate>=0.10.0",
]
dev = [
    "pytest>=9.1.1",
]
