# YouTube voice preset (default).
# Only values that differ from the built-in defaults need to be listed;
# they are all spelled out here so the preset documents itself.
# Thresholds in [post.*] are dBFS at the working level (-23 LUFS).

[restore]
clean_model = "deepfilternet3"   # ML denoiser used by --mode clean
studio_model = "sidon"           # generative model used by --mode studio
fallback = "rnnoise"             # used when the ML stage is unavailable: "rnnoise" or "none"
timeout_s = 900

[pre]
remove_dc = true
highpass = { enabled = true, freq_hz = 80.0, order = 4 }        # 24 dB/oct
hum = { mode = "auto", max_harmonics = 10, detect_threshold_db = 10.0, notch_bandwidth_hz = 2.0 }

[post]
working_lufs = -23.0
phase_rotator = { enabled = true, freq_hz = 300.0, q = 0.5, sections = 4 }
# Adaptive correction layer: per-file EQ toward the neutral speech spectrum
# (Byrne et al. 1994 LTASS). The fixed EQ below is the "character" layer.
# Only 200 Hz-12.5 kHz, only deviations beyond +-2 dB, gently capped:
# keep the talker sounding like themselves.
tone_correction = { enabled = true, max_cut_db = 6.0, max_boost_db = 4.0, deadband_db = 2.0, strength = 0.0, min_snr_db = 10.0, min_speech_seconds = 8.0 }
subtractive_eq = { enabled = true, freq_hz = 300.0, q = 1.0, gain_db = -2.5 }

[post.expander]
enabled = true
auto_threshold = true
auto_margin_db = 6.0
hysteresis_db = 4.0
hold_ms = 150.0
ratio = 2.0
range_db = 8.0
open_ms = 2.0
close_ms = 150.0
lookahead_ms = 10.0

[post.compressor]
enabled = true
threshold_db = -30.0
ratio = 3.0
knee_db = 6.0
attack_ms = 10.0
release_ms = 100.0
lookahead_ms = 10.0
auto_makeup = true

[post.additive_eq]
# Off by default: in a blind listening comparison the natural tone was
# preferred. Turn on per run with
# --set post.additive_eq.presence.enabled=true (and .air).
presence = { enabled = false, freq_hz = 4000.0, q = 1.0, gain_db = 2.0 }
air = { enabled = false, freq_hz = 11000.0, slope = 1.0, gain_db = 1.5 }

[post.deesser]
enabled = true
detector_low_hz = 5000.0
detector_high_hz = 8000.0
split_hz = 4500.0
threshold_db = -32.0          # active 5-9% of the time on real laptop-mic takes (-38: 14-21%, fighting the presence/air boost)
ratio = 4.0
max_reduction_db = 6.0

[post.loudness]
target_lufs = -14.0
max_gain_db = 40.0
dual_mono = false

[post.limiter]
enabled = true
ceiling_dbtp = -1.0
video_ceiling_dbtp = -1.5        # video outputs: AAC/Opus encoding overshoots a little
lookahead_ms = 5.0
release_ms = 80.0
bandlimit_hz = 20000.0
